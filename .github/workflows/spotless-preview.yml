name: spotless_preview

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify Spotless formatting
        run: ./gradlew spotlessCheck
