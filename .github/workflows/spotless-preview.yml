name: spotless_preview

on:
  pull_request:
    branches: [ main ]

jobs:
  preview:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply Spotless locally
        run: ./gradlew spotlessApply
      - name: Print formatter patch
        run: |
          git --no-pager diff -- app/src/main/java/app/opendocument/droid/intelligence
